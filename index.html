<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch họp công ty</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        table {
            width: 70%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>Lịch họp công ty</h1>

    <table>
        <thead>
            <tr>
                <th>Ngày</th>
                <th>Giờ</th>
                <th>Nội dung cuộc họp</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Thứ Hai</td>
                <td>08:30 - 09:30</td>
                <td>Họp giao ban đầu tuần</td>
            </tr>
            <tr>
                <td>14:00 - 15:30</td>
                <td>Báo cáo tiến độ dự án mới</td>
            </tr>
            <tr>
                <td rowspan="2">Thứ Ba</td>
                <td>09:00 - 10:00</td>
                <td>Gặp gỡ đối tác khách hàng</td>
            </tr>
            <tr>
                <td>15:00 - 16:30</td>
                <td>Đào tạo nội bộ nhóm kỹ thuật</td>
            </tr>
            <tr>
                <td>Thứ Sáu</td>
                <td colspan="2">Họp tổng kết tháng toàn công ty (Cả ngày)</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
